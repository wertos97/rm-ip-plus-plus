name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Test and build Apple Silicon app
        run: bash build-macos.sh
      - name: Verify architecture
        run: test "$(lipo -archs "dist/RM IP++.app/Contents/MacOS/RM IP++")" = "arm64"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RMIPpp-macos-arm64
          path: dist/macos/*.zip
